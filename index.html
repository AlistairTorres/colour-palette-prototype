<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small browser prototype for generating and copying colour palettes.">
  <title>Colour Palette Prototype</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <p class="eyebrow">Interface experiment</p>
    <h1>Colour palette</h1>
    <p>Generate five colours and copy any value for reuse.</p>
    <div id="palette" class="palette" aria-label="Generated colour palette"></div>
    <div class="actions">
      <button id="generate" type="button">Generate palette</button>
      <button id="copy-all" type="button" class="secondary">Copy all values</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
